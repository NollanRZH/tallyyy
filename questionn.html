<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Very Important Question</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: #fff0f5;
  font-family: 'Georgia', serif;
  overflow: hidden;
}

#app, #yes-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff0f5;
  padding: 1.5rem;
}

#yes-screen { display: none; }

.card {
  background: white;
  border-radius: 24px;
  padding: 2.5rem 2rem;
  text-align: center;
  box-shadow: 0 8px 40px rgba(200,50,100,0.13);
  width: 100%;
  max-width: 420px;
  border: 1.5px solid #ffb3cc;
}

.emoji-top {
  font-size: 2.8rem;
  display: block;
  margin-bottom: 1rem;
  animation: bob 2s infinite ease-in-out;
}

@keyframes bob {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

h1 {
  font-size: clamp(1.1rem, 4.5vw, 1.55rem);
  color: #c2185b;
  font-weight: 700;
  line-height: 1.45;
  margin-bottom: 0.35rem;
}

.subtitle {
  font-size: 0.78rem;
  color: #e9659a;
  font-style: italic;
  margin-bottom: 2rem;
}

.troll-msg {
  color: #c2185b;
  font-size: 0.85rem;
  font-style: italic;
  margin-top: 1.2rem;
  min-height: 1.1rem;
  animation: popIn 0.2s ease;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}

.btn-yes {
  background: #e91e8c;
  color: white;
  border: none;
  border-radius: 50px;
  padding: 12px 32px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}

.btn-yes:hover { opacity: 0.9; }
.btn-yes:active { transform: scale(0.96); }

#btn-no {
  background: white;
  color: #888;
  border: 1.5px solid #ddd;
  border-radius: 50px;
  padding: 10px 24px;
  font-size: 1rem;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}

#btn-no.floating {
  position: fixed;
  z-index: 9999;
}

#btn-no-ghost {
  visibility: hidden;
  padding: 10px 24px;
  font-size: 1rem;
  border-radius: 50px;
  border: 1.5px solid transparent;
  white-space: nowrap;
  pointer-events: none;
  font-family: inherit;
}

.btns-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1rem;
}

.yes-card {
  background: white;
  border-radius: 24px;
  padding: 2.5rem 2rem;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 8px 40px rgba(200,50,100,0.13);
  border: 1.5px solid #ffb3cc;
}

.yes-emoji { font-size: 3rem; display: block; margin-bottom: 1rem; }
.yes-title { font-size: clamp(1.3rem,5vw,1.8rem); color: #c2185b; font-weight: 700; margin-bottom: 0.75rem; }
.yes-text { color: #e9659a; font-size: 0.97rem; line-height: 1.75; }

.confetti-p {
  position: fixed;
  border-radius: 2px;
  animation: cfall 3s forwards;
  pointer-events: none;
  z-index: 9998;
}

@keyframes cfall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
</style>
</head>
<body>

<div id="app">
  <div class="card">
    <span class="emoji-top">🐣</span>
    <h1>Are you my mommy<br>and I'm your good boy?</h1>
    <p class="subtitle">~ a very serious and important question ~</p>
    <div class="btns-wrap">
      <button class="btn-yes" onclick="onYes()">YES</button>
      <span id="btn-no-ghost">NO</span>
      <button id="btn-no">NO</button>
    </div>
    <p class="troll-msg" id="troll-msg"></p>
  </div>
</div>

<div id="yes-screen">
  <div class="yes-card">
    <span class="yes-emoji">🎉</span>
    <p class="yes-title">LET'S GOOOOO!!</p>
    <p class="yes-text">
      I KNEW IT!! You're literally my mommy forever and I'm your good boy!<br><br>
      Thank you mommy, you're the best thing ever.<br><br>
      Now give me a hug RIGHT NOW!!
    </p>
  </div>
</div>

<script>
const trollMsgs = [
  "lol imagine clicking no",
  "good luck with that",
  "too slow!!",
  "haha nice try",
  "the button is scared of you",
  "running at the speed of light",
  "u really thought...",
  "not today",
  "this button has trust issues",
  "404 - no not found",
  "the button said bye",
  "pathetic",
  "bro cant even click a button",
  "try harder, do better",
  "maybe just say yes??",
  "still trying? respect the grind",
  "lmaoooo",
  "the no has left the building",
  "absolutely not",
  "nice reflexes... not",
];

const btn = document.getElementById('btn-no');
const ghost = document.getElementById('btn-no-ghost');
const msgEl = document.getElementById('troll-msg');
let floating = false;
let attempts = 0;
let msgIdx = 0;
let isHidden = false;
let cooldown = false;

function getBtn() {
  return {
    x: parseFloat(btn.style.left) || 0,
    y: parseFloat(btn.style.top) || 0,
    w: btn.offsetWidth,
    h: btn.offsetHeight,
  };
}

function makeFloat() {
  if (floating) return;
  floating = true;
  const r = btn.getBoundingClientRect();
  btn.classList.add('floating');
  btn.style.left = r.left + 'px';
  btn.style.top = r.top + 'px';
  btn.style.width = r.width + 'px';
}

function showMsg() {
  msgEl.style.animation = 'none';
  void msgEl.offsetHeight;
  msgEl.style.animation = 'popIn 0.2s ease';
  msgEl.textContent = trollMsgs[msgIdx % trollMsgs.length];
  msgIdx++;
}

function flee(cx, cy) {
  if (isHidden || cooldown) return;
  if (!floating) makeFloat();
  cooldown = true;
  setTimeout(() => cooldown = false, 60);

  attempts++;
  showMsg();

  const b = getBtn();
  const bcx = b.x + b.w / 2;
  const bcy = b.y + b.h / 2;
  const dx = bcx - cx;
  const dy = bcy - cy;
  const dist = Math.hypot(dx, dy) || 1;
  const speed = Math.min(260 + attempts * 12, 420);

  let nx = b.x + (dx / dist) * speed + (Math.random() - 0.5) * 60;
  let ny = b.y + (dy / dist) * speed + (Math.random() - 0.5) * 60;

  const vw = window.innerWidth;
  const vh = window.innerHeight;
  nx = Math.max(6, Math.min(vw - b.w - 6, nx));
  ny = Math.max(6, Math.min(vh - b.h - 6, ny));

  btn.style.left = nx + 'px';
  btn.style.top = ny + 'px';

  if (attempts >= 4 && Math.random() < 0.28) {
    vanish();
  } else if (attempts >= 7 && Math.random() < 0.22) {
    teleport(cx, cy);
  }
}

function teleport(cx, cy) {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const bw = btn.offsetWidth;
  const bh = btn.offsetHeight;
  let nx, ny, d = 0, t = 0;
  do {
    nx = 10 + Math.random() * (vw - bw - 20);
    ny = 10 + Math.random() * (vh - bh - 20);
    d = Math.hypot(nx - (cx || 0), ny - (cy || 0));
    t++;
  } while (d < 160 && t < 20);
  btn.style.left = nx + 'px';
  btn.style.top = ny + 'px';
}

function vanish() {
  isHidden = true;
  btn.style.opacity = '0';
  btn.style.pointerEvents = 'none';
  const delay = 600 + Math.random() * 800;
  setTimeout(() => {
    teleport(-999, -999);
    btn.style.opacity = '1';
    btn.style.pointerEvents = 'auto';
    isHidden = false;
  }, delay);
}

function handleProximity(cx, cy) {
  if (!floating || isHidden) return;
  const b = getBtn();
  const bcx = b.x + b.w / 2;
  const bcy = b.y + b.h / 2;
  const d = Math.hypot(cx - bcx, cy - bcy);
  if (d < 90) flee(cx, cy);
}

btn.addEventListener('mouseenter', e => flee(e.clientX, e.clientY));
btn.addEventListener('mousemove', e => flee(e.clientX, e.clientY));
btn.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  flee(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('mousemove', e => handleProximity(e.clientX, e.clientY));
document.addEventListener('touchmove', e => {
  const t = e.touches[0];
  handleProximity(t.clientX, t.clientY);
}, { passive: true });

function onYes() {
  btn.style.display = 'none';
  spawnConfetti();
  document.getElementById('app').style.display = 'none';
  document.getElementById('yes-screen').style.display = 'flex';
}

function spawnConfetti() {
  const colors = ['#e91e8c','#ff4d94','#ffb3d1','#c2185b','#ff80ab'];
  for (let i = 0; i < 55; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti-p';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-10px';
      c.style.background = colors[i % colors.length];
      c.style.width = (5 + Math.random() * 8) + 'px';
      c.style.height = (5 + Math.random() * 8) + 'px';
      c.style.animationDuration = (1.8 + Math.random() * 1.5) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }, i * 40);
  }
}
</script>
</body>
</html>
