
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  #app {
    min-height: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff0f5;
    padding: 2rem;
    position: relative;
    overflow: hidden;
    font-family: 'Georgia', serif;
  }

  .card {
    background: white;
    border-radius: 24px;
    padding: 2.5rem 2rem;
    text-align: center;
    box-shadow: 0 8px 40px rgba(200, 50, 100, 0.15);
    max-width: 480px;
    width: 100%;
    position: relative;
    z-index: 1;
    border: 1.5px solid #ffb3cc;
  }

  .emoji-top {
    font-size: 3rem;
    margin-bottom: 1rem;
    display: block;
    animation: bob 2s infinite ease-in-out;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  h1 {
    font-size: clamp(1.2rem, 4vw, 1.65rem);
    color: #c2185b;
    margin-bottom: 0.4rem;
    font-weight: 700;
    line-height: 1.4;
  }

  .subtitle {
    font-size: 0.82rem;
    color: #e9659a;
    margin-bottom: 2rem;
    font-style: italic;
  }

  .buttons-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    margin-top: 1.5rem;
    position: relative;
    min-height: 56px;
  }

  .btn-yes {
    background: #e91e8c;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 13px 34px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.1s;
    flex-shrink: 0;
  }

  .btn-yes:hover { transform: scale(1.06); }
  .btn-yes:active { transform: scale(0.95); }

  #btn-no {
    background: white;
    color: #888;
    border: 1.5px solid #ddd;
    border-radius: 50px;
    padding: 11px 26px;
    font-size: 1rem;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    position: fixed;
    z-index: 9999;
    transition: left 0.08s, top 0.08s;
    user-select: none;
    -webkit-user-select: none;
  }

  .troll-msg {
    color: #c2185b;
    font-size: 0.88rem;
    margin-top: 1.2rem;
    min-height: 1.2rem;
    font-style: italic;
    animation: popIn 0.25s ease;
    position: relative;
    z-index: 1;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  #yes-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 600px;
    text-align: center;
    padding: 2rem;
    background: #fff0f5;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }

  .yes-card {
    background: white;
    border-radius: 24px;
    padding: 2.5rem 2rem;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(200, 50, 100, 0.15);
    border: 1.5px solid #ffb3cc;
  }

  .yes-emoji { font-size: 3.5rem; display: block; margin-bottom: 1rem; }
  .yes-title { font-size: clamp(1.3rem, 5vw, 1.8rem); color: #c2185b; font-weight: 700; margin-bottom: 0.75rem; }
  .yes-text { color: #e9659a; font-size: 1rem; line-height: 1.7; }

  .confetti-p {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 2px;
    animation: cfall 3s forwards;
    pointer-events: none;
    z-index: 9998;
  }

  @keyframes cfall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>

<div id="app">
  <div class="card" id="main-card">
    <span class="emoji-top">🐣</span>
    <h1>Are you my mommy<br>and I'm your good boy?</h1>
    <p class="subtitle">~ a very serious and important question ~</p>
    <div class="buttons-row">
      <button class="btn-yes" onclick="onYes()">YES</button>
      <button id="btn-no">NO</button>
    </div>
    <p class="troll-msg" id="troll-msg"></p>
  </div>
</div>

<div id="yes-screen">
  <div class="yes-card">
    <span class="yes-emoji">🎉</span>
    <p class="yes-title">LET'S GOOOOO!!</p>
    <p class="yes-text">
      I KNEW IT!! You're literally my mommy forever and I'm your good boy!<br><br>
      Thank you mommy, you're the best thing ever.<br><br>
      Now give me a hug RIGHT NOW!!
    </p>
  </div>
</div>

<script>
const trollMsgs = [
  "lol imagine clicking no",
  "good luck with that",
  "the button said nope",
  "too slow!!",
  "haha nice try",
  "the no is scared of you",
  "running away at the speed of light",
  "u really thought...",
  "not today sis",
  "this button has trust issues",
  "technically it's right there though",
  "pathetic",
  "bro cant even click a button",
  "the no said bye bye",
  "404 - no not found",
  "the button is faster than your future",
  "maybe just say yes??",
  "still trying?? respect the grind i guess",
  "lmaoooo",
  "try harder, do better",
];

const btn = document.getElementById('btn-no');
const msgEl = document.getElementById('troll-msg');
let msgIdx = 0;
let attempts = 0;
let isVisible = true;
let hideTimeout = null;

function getViewport() {
  return { w: window.innerWidth, h: window.innerHeight };
}

function placeInitial() {
  const vp = getViewport();
  const bw = btn.offsetWidth || 90;
  const bh = btn.offsetHeight || 44;
  const x = vp.w / 2 + 20;
  const y = vp.h / 2;
  btn.style.left = x + 'px';
  btn.style.top = y + 'px';
}

function randomPos(excludeX, excludeY) {
  const vp = getViewport();
  const bw = btn.offsetWidth || 90;
  const bh = btn.offsetHeight || 44;
  const margin = 16;
  let x, y, dist = 0;
  let tries = 0;
  do {
    x = margin + Math.random() * (vp.w - bw - margin * 2);
    y = margin + Math.random() * (vp.h - bh - margin * 2);
    if (excludeX !== undefined) {
      dist = Math.hypot(x - excludeX, y - excludeY);
    }
    tries++;
  } while (dist < 200 && tries < 20);
  return { x, y };
}

function showMsg() {
  msgEl.style.animation = 'none';
  msgEl.offsetHeight;
  msgEl.style.animation = 'popIn 0.25s ease';
  msgEl.textContent = trollMsgs[msgIdx % trollMsgs.length];
  msgIdx++;
}

function flee(cursorX, cursorY) {
  if (!isVisible) return;
  attempts++;
  showMsg();

  const vp = getViewport();
  const bw = btn.offsetWidth || 90;
  const bh = btn.offsetHeight || 44;
  const btnCX = parseFloat(btn.style.left) + bw / 2;
  const btnCY = parseFloat(btn.style.top) + bh / 2;

  const dx = btnCX - cursorX;
  const dy = btnCY - cursorY;
  const dist = Math.hypot(dx, dy) || 1;

  const speed = 220 + Math.min(attempts * 15, 180);
  let newX = parseFloat(btn.style.left) + (dx / dist) * speed + (Math.random() - 0.5) * 80;
  let newY = parseFloat(btn.style.top) + (dy / dist) * speed + (Math.random() - 0.5) * 80;

  newX = Math.max(8, Math.min(vp.w - bw - 8, newX));
  newY = Math.max(8, Math.min(vp.h - bh - 8, newY));

  btn.style.left = newX + 'px';
  btn.style.top = newY + 'px';

  if (attempts > 4 && Math.random() < 0.3) {
    vanishAndReappear();
  }

  if (attempts > 8 && Math.random() < 0.25) {
    btn.style.transition = 'left 0s, top 0s';
    const pos = randomPos(cursorX, cursorY);
    btn.style.left = pos.x + 'px';
    btn.style.top = pos.y + 'px';
    setTimeout(() => { btn.style.transition = 'left 0.08s, top 0.08s'; }, 50);
  }
}

function vanishAndReappear() {
  if (!isVisible) return;
  isVisible = false;
  btn.style.opacity = '0';
  btn.style.pointerEvents = 'none';

  const delay = 500 + Math.random() * 700;
  hideTimeout = setTimeout(() => {
    const pos = randomPos();
    btn.style.left = pos.x + 'px';
    btn.style.top = pos.y + 'px';
    btn.style.opacity = '1';
    btn.style.pointerEvents = 'auto';
    isVisible = true;
  }, delay);
}

btn.addEventListener('mousemove', (e) => { flee(e.clientX, e.clientY); });
btn.addEventListener('mouseenter', (e) => { flee(e.clientX, e.clientY); });
btn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  flee(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('mousemove', (e) => {
  if (!isVisible) return;
  const bw = btn.offsetWidth || 90;
  const bh = btn.offsetHeight || 44;
  const bx = parseFloat(btn.style.left);
  const by = parseFloat(btn.style.top);
  const dist = Math.hypot(e.clientX - (bx + bw/2), e.clientY - (by + bh/2));
  if (dist < 80) {
    flee(e.clientX, e.clientY);
  }
});

document.addEventListener('touchmove', (e) => {
  if (!isVisible) return;
  const t = e.touches[0];
  const bw = btn.offsetWidth || 90;
  const bh = btn.offsetHeight || 44;
  const bx = parseFloat(btn.style.left);
  const by = parseFloat(btn.style.top);
  const dist = Math.hypot(t.clientX - (bx + bw/2), t.clientY - (by + bh/2));
  if (dist < 100) {
    flee(t.clientX, t.clientY);
  }
}, { passive: true });

function onYes() {
  btn.style.display = 'none';
  spawnConfetti();
  document.getElementById('app').style.display = 'none';
  const ys = document.getElementById('yes-screen');
  ys.style.display = 'flex';
}

function spawnConfetti() {
  const colors = ['#e91e8c','#ff4d94','#ffb3d1','#c2185b','#ff80ab'];
  for (let i = 0; i < 55; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti-p';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.width = (5 + Math.random() * 9) + 'px';
      c.style.height = (5 + Math.random() * 9) + 'px';
      c.style.animationDuration = (1.8 + Math.random() * 1.5) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }, i * 45);
  }
}

window.addEventListener('load', () => {
  placeInitial();
});

setTimeout(placeInitial, 100);
</script>
